# In-domain LoRA SFT: central banking / finance en<->fr from the OPUS ECB corpus
# (open_data/make_ecb_enfr.py: detokenized, PDF damage and boilerplate removed, LaBSE-aligned,
# eval held out by page and with no 8-word overlap with train). Domain "Finance" in the prompt.
# Baked into the sft image (images/sft/Dockerfile) as its default config; output in /workspace/out.
model_path: /opt/ckpt/ovhaillm-rl   # OvhaiLLM-RL (RL run ART, global step 294)
output_dir: /workspace/out

train_files:
  - /opt/mt/data/open/ecb_enfr_train.jsonl   # 4000 pairs, half en->fr, half fr->en
eval_files:
  - /opt/mt/data/open/ecb_enfr_eval.jsonl    # 400 pairs, also the benchmark

max_length: 4096
overlong: drop

lora:
  r: 32
  alpha: 64
  dropout: 0.05

training:
  num_train_epochs: 2            # 4000 rows / (8 x 2) per step -> 500 steps on 1 GPU
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-5          # gentle: the base is already strong, we only adapt it to the domain
  warmup_steps: 25
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 50
  per_device_eval_batch_size: 8
  save_steps: 250
